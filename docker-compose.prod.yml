# Server operation with a public HTTPS address (path B).
# Start: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Prerequisite in .env: DOMAIN=mydashboard.example, COOKIE_SECURE=true, APP_ENV=production
# Only Caddy is reachable from outside (ports 80/443). The app itself has no host port.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN in .env setzen (z. B. meindashboard.de)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
  web:
    ports: !reset []
volumes:
  caddy_data:
  caddy_config:
